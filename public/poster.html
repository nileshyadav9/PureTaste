<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Menu Poster | Pure Taste by Chef David</title>
  <link rel="icon" href="assets/logo/favicon-32.png" sizes="32x32">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <style>
    body { min-height: 100vh; background: var(--char); }
    .poster-page { padding: 32px 0 64px; }
    .poster-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
    .poster-head h1 { font-size: clamp(1.8rem, 4vw, 2.4rem); margin: 0; }
    .poster-head p { margin: 4px 0 0; color: var(--muted); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .seg { display: inline-flex; padding: 4px; border-radius: 999px; border: 1px solid var(--line); background: var(--ink); }
    .seg button { border: 0; background: none; padding: 9px 16px; border-radius: 999px; color: var(--cream-dim); font-weight: 600; cursor: pointer; }
    .seg button[aria-pressed="true"] { background: var(--gold); color: var(--ink); }
    .stage { display: grid; place-items: center; padding: clamp(12px, 3vw, 28px); border-radius: var(--radius); background: var(--ink); border: 1px solid var(--line-soft); }
    .stage canvas { width: auto; max-width: 100%; max-height: 78vh; height: auto; border-radius: 6px; box-shadow: var(--shadow); }
    .status { color: var(--muted); min-height: 1.6em; margin-top: 12px; }
  </style>
</head>
<body>
  <main class="wrap poster-page">
    <div class="poster-head">
      <div>
        <h1>Menu poster</h1>
        <p>Built from this week's menu. Download it and post it to Facebook.</p>
      </div>
      <div class="toolbar">
        <div class="seg" role="group" aria-label="Poster size">
          <button type="button" data-format="feed" aria-pressed="true">Feed 4:5</button>
          <button type="button" data-format="story" aria-pressed="false">Story 9:16</button>
        </div>
        <button class="btn btn-ghost" type="button" data-share hidden>Share</button>
        <button class="btn btn-gold" type="button" data-download><svg aria-hidden="true"><use href="assets/icons.svg#i-download"/></svg> Download PNG</button>
      </div>
    </div>
    <div class="stage"><canvas id="poster" aria-label="Weekly menu poster preview"></canvas></div>
    <p class="status" role="status"></p>
  </main>

  <script type="module">
    import { getMenu } from './js/data.js';
    import { drawPoster } from './js/poster.js';

    const canvas = document.getElementById('poster');
    const status = document.querySelector('.status');
    const shareBtn = document.querySelector('[data-share]');
    let menu, format = 'feed';

    const fileName = () => `puretaste-menu-${menu.weekStart}-${format}.png`;
    const toBlob = () => new Promise((r) => canvas.toBlob(r, 'image/png'));

    async function render() {
      status.textContent = 'Drawing poster…';
      await drawPoster(canvas, menu, { format });
      status.textContent = '';
    }

    document.querySelectorAll('[data-format]').forEach((b) => b.addEventListener('click', () => {
      format = b.dataset.format;
      document.querySelectorAll('[data-format]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      render();
    }));

    document.querySelector('[data-download]').addEventListener('click', async () => {
      const url = URL.createObjectURL(await toBlob());
      const a = Object.assign(document.createElement('a'), { href: url, download: fileName() });
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    });

    // Phones: share straight to Facebook/Messages through the system share sheet.
    if (navigator.canShare?.({ files: [new File([''], 'x.png', { type: 'image/png' })] })) {
      shareBtn.hidden = false;
      shareBtn.addEventListener('click', async () => {
        const file = new File([await toBlob()], fileName(), { type: 'image/png' });
        try { await navigator.share({ files: [file], title: "This Week's Menu" }); } catch {}
      });
    }

    try {
      menu = await getMenu();
      await render();
    } catch (err) {
      console.error(err);
      status.textContent = 'Could not load the menu.';
    }
  </script>
</body>
</html>
